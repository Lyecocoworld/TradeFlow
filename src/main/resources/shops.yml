# ---------------------------------------------------- #
#            TradeFlow Shop Configuration File           #
# ---------------------------------------------------- #
# This file defines the layout of your shop GUI and all the items available within it.
# Prices and limits will automatically adjust based on supply & demand,
# and now, also based on crafting costs and economic events!
# Global stock: every item now has a weekly base stock window. Configure per-item with
# base-stock-min/base-stock-max (stock filled each week if below the target) and optional
# global-stock-limit/global-stock-period. If not set, defaults are applied automatically.

# --- SECTIONS CONFIGURATION ---
defaults: {}
sections:
  blocks:
    display: <b><gold>Building Blocks</gold></b>
    image: bricks
    x: 2
    y: 1
  
  nature:
    display: <b><green>Nature & Flora</green></b>
    image: oak_sapling
    x: 3
    y: 1

  colors:
    display: <b><light_purple>Colors & Decor</light_purple></b>
    image: pink_wool
    x: 4
    y: 1

  minerals:
    display: <b><aqua>Ores & Valuables</aqua></b>
    image: diamond
    x: 5
    y: 1

  farming:
    display: <b><yellow>Farming & Food</yellow></b>
    image: golden_carrot
    x: 6
    y: 1

  mob_drops:
    display: <b><red>Mob Drops</red></b>
    image: skeleton_skull
    x: 7
    y: 1

  nether_end:
    display: <b><dark_purple>Nether & End</dark_purple></b>
    image: ender_eye
    x: 8
    y: 1

  redstone:
    display: <b><dark_red>Redstone & Tech</dark_red></b>
    image: redstone
    x: 3
    y: 2

  misc:
    display: <b><gray>Miscellaneous</gray></b>
    image: bundle
    x: 4
    y: 2

  tools:
    display: <b><gray>Tools & Combat</gray></b>
    image: iron_sword
    x: 5
    y: 2

  enchantments:
    display: <b><gold>Enchantments</gold></b>
    image: enchanted_book
    x: 6
    y: 2
    collect-first: NONE

# --- SHOP ITEMS CONFIGURATION ---
