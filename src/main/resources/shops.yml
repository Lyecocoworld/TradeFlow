# - Common blocks (Cobble, Dirt) have very low sell prices to prevent clutter profit.
# - Farmable items (Iron, Gold, Emerald) have aggressive spreads (Buy High, Sell Low) to nerf AFK farms.
# - Rare items (Diamonds, Netherite) maintain value better (Sell is ~50-60% of Buy).
# - Volatility is higher on luxury items to simulate market panic.

